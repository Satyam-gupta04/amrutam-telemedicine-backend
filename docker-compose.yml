version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: amrutam_postgres
    restart: always
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: amrutam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d amrutam"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amrutam_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: amrutam_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://appuser:apppassword@db:5432/amrutam
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: amrutam-telemedicine-super-secret-key-32bytes-minimum-required
      ENVIRONMENT: production
      DEBUG: "False"
      API_V1_PREFIX: /api/v1
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
